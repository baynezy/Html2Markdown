name: Deploy HotFix Branch

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - master
  workflow_dispatch:

jobs:
  get-version:
    if: startsWith(github.head_ref, 'hotfix/')
    uses: ./.github/workflows/step-version.yml
  
  build:
    needs: [get-version]
    uses: ./.github/workflows/step-build.yml
    with:
      version: ${{ needs.get-version.outputs.version }}
      checkout-ref: ${{ github.head_ref }}
  
  check-markdown:
    needs: [get-version]
    uses: ./.github/workflows/step-check-markdown.yml
    
  update-metadata:
    if: github.event.action == 'opened'
    needs: [get-version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ github.head_ref }}
      - name: Increment Version
        id: increment_version
        run: |
          echo "patch_version=$(($(cat semver.json | jq -r '.patch')+1))" > $GITHUB_OUTPUT
      - name: Store New Version
        uses: Afterlife-Guide/SemVer.Action@64735fc76aaefe739484e00949686ba8a1ded868 # 1.3.10.26
        with:
          path: semver.json
          major-version: ${{ needs.get-version.outputs.major }}
          minor-version: ${{ needs.get-version.outputs.minor }}
          patch-version: ${{ steps.increment_version.outputs.patch_version }}
          build-version: ${{ github.run_number }}
      - name: Update changelog
        id: changelog
        uses: baynezy/ChangeLogger.Action@6e3ad430f08e13698bb01027a13ba4349b0143cc # 1.2.4.10
        with:
          tag: ${{ needs.get-version.outputs.major }}.${{ needs.get-version.outputs.minor }}.${{ steps.increment_version.outputs.patch_version }}.${{ github.run_number }}
      - name: Commit Changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "baynezy@gmail.com"
          git add CHANGELOG.md semver.json
          git commit --message "Bump Version to ${{ needs.get-version.outputs.major }}.${{ needs.get-version.outputs.minor }}.${{ steps.increment_version.outputs.patch_version }}.${{ github.run_number }}"

      - name: Push Version
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: git push origin $GITHUB_HEAD_REF

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.get-version.outputs.major }}.${{ needs.get-version.outputs.minor }}.${{ steps.increment_version.outputs.patch_version }}.${{ github.run_number }}
          NOTES: ${{ steps.changelog.outputs.release-notes }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --notes "$NOTES"
          else
            gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target master \
            --title "$VERSION" \
            --notes "$NOTES"
          fi
