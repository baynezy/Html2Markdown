on:
  workflow_call:
    inputs:
      version:
        required: true
        description: 'Version to deploy'
        type: string
    secrets:
      gh-token:
        required: true
        description: >-
          Personal access token used to push the release tag. The built-in
          GITHUB_TOKEN can never push a ref pointing at a commit that touches
          files under .github/workflows, so this must be a token with the
          classic 'workflow' scope (or 'Contents: write' + 'Workflows: write'
          for a fine-grained PAT).

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false
      - name: Create tag
        env:
          GH_TOKEN: ${{ secrets.gh-token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh auth setup-git
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "baynezy@gmail.com"
          git tag -a "$VERSION" -m "Version $VERSION created via GitHub Actions"
          git push origin "$VERSION"
